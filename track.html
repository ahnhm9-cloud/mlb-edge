<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16305C"><title>MLB Edge · 적중 추적</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"><style>
:root{--ground:#F3F4F1;--paper:#FFFFFF;--ink:#151A21;--ink2:#3E4754;--muted:#6E7783;--rule:#DFE3E8;--rule2:#EEF1F4;
--navy:#16305C;--navy-soft:#E6ECF6;--red:#C8102E;--red-soft:#FCE8EB;--amber:#A8670F;--amber-soft:#FBF0D8;--green:#1E7650;--green-soft:#E2F2E9;
--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--disp:"Barlow Condensed","IBM Plex Sans KR",sans-serif;--shadow:0 1px 2px rgba(21,26,33,.06),0 4px 14px rgba(21,26,33,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E1216;--paper:#171C22;--ink:#E8ECF1;--ink2:#C4CBD5;--muted:#8E98A5;--rule:#2A323C;--rule2:#1F262E;--navy:#9DB8EA;--navy-soft:#1B2A44;--red:#FF7A88;--red-soft:#3A1B21;--amber:#F2C56E;--amber-soft:#3A2F15;--green:#6ED09E;--green-soft:#163127;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--ground:#0E1216;--paper:#171C22;--ink:#E8ECF1;--ink2:#C4CBD5;--muted:#8E98A5;--rule:#2A323C;--rule2:#1F262E;--navy:#9DB8EA;--navy-soft:#1B2A44;--red:#FF7A88;--red-soft:#3A1B21;--amber:#F2C56E;--amber-soft:#3A2F15;--green:#6ED09E;--green-soft:#163127;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;min-width:0}html,body{margin:0}body{overflow-x:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1}
nav a{font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:999px;color:var(--muted)}nav a.on{background:var(--navy);color:#fff}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 72px}
.dates{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;font-family:var(--mono);font-size:13px;font-weight:500;padding:8px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);border-radius:10px;min-height:40px}.dates button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}.tile .k{font-size:11.5px;color:var(--muted)}.tile .v{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.1;margin-top:2px}.tile .s{font-size:12px;color:var(--ink2);margin-top:2px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.filters button{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);min-height:36px}.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.help{font-size:12.5px;color:var(--muted);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin:0 0 12px;line-height:1.6}.help b{color:var(--ink2)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.card.t3{border-color:var(--red)}.card.t2{border-color:var(--amber)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 0}
.when{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink2)}.when small{font-family:var(--sans);font-weight:500;color:var(--muted);margin-left:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.tag.t3{background:var(--red-soft);color:var(--red)}.tag.t2{background:var(--amber-soft);color:var(--amber)}.tag.t1{background:var(--navy-soft);color:var(--navy)}
.teams{padding:8px 14px 4px;display:grid;gap:4px}
.team{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:baseline}
.team b{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.01em}.team .rec{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}.team .sp{font-size:13px;color:var(--ink2)}.team .sp em{font-style:normal;color:var(--muted)}
.grid{margin:8px 14px 0;border:1px solid var(--rule2);border-radius:10px;overflow:hidden}
.grid .r{display:grid;grid-template-columns:46px repeat(3,minmax(0,1fr));align-items:center;padding:7px 10px;font-family:var(--mono);font-size:14px}
.grid .r.h{font-family:var(--sans);font-size:11.5px;color:var(--muted);background:var(--rule2);padding:6px 10px}
.grid .r+.r:not(.h){border-top:1px solid var(--rule2)}
.grid .r span:not(:first-child){text-align:right}.grid .r b{font-family:var(--disp);font-size:16px}.grid .fav{color:var(--navy);font-weight:600}.grid .dim{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 14px 0}
.kpi{background:var(--rule2);border-radius:10px;padding:7px 10px}.kpi .k{font-size:11px;color:var(--muted)}.kpi .v{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi.hi .v{color:var(--green)}
.sum{padding:10px 14px 12px;font-size:14px;line-height:1.55;color:var(--ink)}.sum .cau{color:var(--amber);display:block;margin-top:4px;font-size:13px}
.facs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;align-items:center}.facs .fh{font-size:11.5px;font-weight:700;color:var(--amber);letter-spacing:.02em;margin-right:2px}.facs .fc{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--amber-soft);color:var(--ink2);line-height:1.35}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:0;border-top:1px solid var(--rule2);background:transparent;color:var(--navy);font-weight:600;font-size:13.5px;min-height:44px}
.detail{display:none;border-top:1px solid var(--rule2);padding:12px 14px 14px;background:var(--rule2)}.card.open .detail{display:block}
.detail h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted)}.detail ol{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink2);line-height:1.6}.detail li{margin-bottom:7px}
.detail .pts{margin-top:10px;display:grid;gap:5px}.pt{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;font-size:12.5px}.pt .tr{height:8px;background:var(--rule);border-radius:4px;position:relative}.pt .fl{position:absolute;top:0;height:100%;border-radius:4px}.pt .fl.h{left:50%;background:var(--navy)}.pt .fl.a{right:50%;background:var(--red)}.pt .v{font-family:var(--mono);text-align:right}
.note{font-size:12.5px;color:var(--muted);margin:16px 0 0;line-height:1.6}
h2{font-family:var(--disp);font-size:22px;font-weight:600;margin:20px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden}th,td{padding:8px 10px;border-bottom:1px solid var(--rule2);text-align:left;white-space:nowrap}th{background:var(--rule2);color:var(--muted);font-weight:600;font-size:12px}td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}.tw{overflow-x:auto;margin:8px 0 16px;-webkit-overflow-scrolling:touch}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--rule);border-radius:12px}
</style></head>

<p class="note">확률은 자체 모델(팀 전력·선발·타선 매치업·불펜·휴식·최근 흐름, 2026시즌 경기로 회귀 적합)의 산출값이고, 배당은 ESPN이 제공하는 DraftKings 머니라인입니다. 배당 내재확률은 마진을 제거한 값입니다. 추천은 배당 우세팀이 질 확률이 높은 순서이며 수익을 보장하지 않습니다. 백테스트에서 시장이 모델보다 소폭 정확했고, 누적 성과는 적중 추적에서 확인할 수 있습니다.</p>
